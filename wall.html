<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>게스트북 · GUEST BOOK</title>
<link rel="stylesheet" href="css/base.css?v=1793649565">
<link rel="stylesheet" href="css/wall.css?v=1793649565">
</head>
<body>
<!-- 피그마 "Guest book design · Section 1 · guest book ui" (Main · Front · Back) 를 1024 × 1366 좌표 그대로 -->
<div id="stage">
  <i class="svg" id="logo" role="button" aria-label="CEP"></i>
  <p class="hd" id="hGuest">Guest book</p>
  <p class="hd" id="hVisitors">Visitors:</p>
  <p class="hd" id="hCount">0000</p>
  <div id="grid"><div id="gridIn"></div></div>

  <div id="detail" hidden>
    <div id="dim"></div>
    <button type="button" class="pill" id="reprint">REPRINT</button>
    <button type="button" class="pill red" id="delete">DELETE</button>
    <div id="card"><img id="cardImg" alt=""></div>
    <button type="button" class="arrow" id="prev" aria-label="이전"><i class="svg"></i></button>
    <button type="button" class="arrow" id="next" aria-label="다음"><i class="svg"></i></button>
    <p id="caption"></p>
  </div>
  <div id="toast" role="status"></div>
</div>
<script src="config.js"></script>
<script src="js/common.js?v=1793649565"></script>
<script src="js/dotname.js?v=1793649565"></script>
<script src="js/wall.js?v=1793649565"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="게스트북">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>게스트북 · 키오스크</title>
<link rel="stylesheet" href="css/base.css?v=1794900000">
<link rel="stylesheet" href="css/kiosk.css?v=1794900000">
</head>
<body data-state="boot">
<!-- 피그마 "Guest book design · Section 1 · kiosk ui" 를 1024 × 1366 (iPad Pro 12.9) 좌표 그대로 옮김 -->
<div id="stage">
  <canvas id="faces" aria-hidden="true"></canvas>
  <canvas id="pix" aria-label="픽셀 얼굴"></canvas>
  <div id="dim"></div>
  <div id="flash"></div>
  <i class="svg" id="digit" aria-live="polite"></i>
  <i class="svg ui" id="logo" role="button" aria-label="처음으로"></i>

  <!-- 메인 -->
  <div class="view" id="v-main">
    <div id="mainFade"></div>
    <i class="svg" id="mainTitle" aria-label="CARESPERANTO GUEST BOOK"></i>
    <p id="mainSub">화면을 터치해 방명록을 남겨주세요</p>
  </div>

  <!-- 도형 -->
  <div class="view" id="v-shape">
    <i class="svg title" id="tShape" aria-label="CHOOSE A SHAPE"></i>
    <p class="sub" id="shapeSub">원하시는 도형을 선택해주세요</p>
    <button type="button" class="shape sq" data-shape="square" aria-label="네모"><span></span></button>
    <button type="button" class="shape ci" data-shape="dot" aria-label="동그라미"><span></span></button>
  </div>

  <!-- 촬영 -->
  <div class="view" id="v-photo">
    <i class="svg title" id="tPhoto" aria-label="TAKE A PHOTO"></i>
    <p class="sub" id="photoSub">버튼을 눌러 촬영하세요.</p>
    <button type="button" id="shutter" aria-label="촬영"><i class="svg"></i></button>
    <button type="button" id="retake" aria-label="다시 찍기"><i class="svg"></i><span>RETAKE</span></button>
  </div>

  <!-- 이름 -->
  <div class="view" id="v-name">
    <i class="svg title" id="tName" aria-label="ENTER YOUR NAME"></i>
    <p class="sub" id="nameSub">이름을 입력해주세요.</p>
    <canvas id="nameCv"></canvas>
    <div class="kbd" id="kbdName"></div>
  </div>

  <!-- 남길 말 (터치로 글씨/그림) -->
  <div class="view" id="v-message">
    <div id="paper">
      <i class="svg" id="tMessage" aria-label="LEAVE A MESSAGE"></i>
      <p id="msgSub">터치로 글씨를 쓰거나 그림을 그려보세요.</p>
      <canvas id="drawCv"></canvas>
    </div>
    <div id="deco"></div>
    <button type="button" id="clearBtn" aria-label="지우기"><span>✕ CLEAR</span></button>
  </div>

  <!-- 감사 · 출력 -->
  <div class="view" id="v-thanks">
    <canvas id="thanksName"></canvas>
    <p class="sub" id="thanksSub"><span data-bind="thanks"></span><br><span data-bind="thanksEn"></span></p>
    <button type="button" class="svg-btn" id="printBtn" aria-label="PRINT"><i class="svg"></i></button>
    <button type="button" class="svg-btn" id="gbBtn" aria-label="GUEST BOOK"><i class="svg"></i></button>
  </div>

  <!-- 준비 중 -->
  <div class="view" id="v-error">
    <p class="sub" id="errTitle">잠시 준비 중이에요</p>
    <p class="mono" id="errMsg"></p>
  </div>

  <button type="button" class="svg-btn" id="nextBtn" aria-label="NEXT"><i class="svg"></i></button>
  <div id="toast" role="status"></div>
</div>
<video id="cam" playsinline muted></video>

<script src="vendor/face-api.js"></script>
<script src="vendor/selfie/selfie_segmentation.js"></script>
<script src="config.js"></script>
<script src="js/common.js?v=1794900000"></script>
<script src="js/dotname.js?v=1794900000"></script>
<script src="js/hangul.js?v=1794900000"></script>
<script src="js/kiosk.js?v=1794900000"></script>
</body>
</html>
